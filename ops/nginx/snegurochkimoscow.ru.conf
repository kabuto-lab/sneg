# Redirect the former domain to the canonical .com host.
server {
    include snippets/security-headers.conf;
    listen 80;
    listen [::]:80;
    server_name snegurochkimoscow.ru www.snegurochkimoscow.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://snegurochkimoscow.com$request_uri; }
}

server {
    include snippets/security-headers.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snegurochkimoscow.ru www.snegurochkimoscow.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://snegurochkimoscow.com$request_uri; }
    ssl_certificate /etc/letsencrypt/live/snegurochkimoscow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snegurochkimoscow.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
