server {
    include snippets/security-headers.conf;
    listen 80;
    listen [::]:80;
    server_name snegurochkimoscow.com www.snegurochkimoscow.com;
    # Webmaster verification must return 200 directly, including over HTTP.
    location ~ ^/yandex_[0-9a-f]+\.html$ {
        root /var/www/verify/snegurochkimoscow.com;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://snegurochkimoscow.com$request_uri; }
}

server {
    include snippets/security-headers.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.snegurochkimoscow.com;
    location ~ ^/yandex_[0-9a-f]+\.html$ {
        root /var/www/verify/snegurochkimoscow.com;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://snegurochkimoscow.com$request_uri; }
    ssl_certificate /etc/letsencrypt/live/snegurochkimoscow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snegurochkimoscow.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    include snippets/security-headers.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snegurochkimoscow.com;
    location ^~ /favicons/ {
        alias /opt/2nas/web/public/favicons/;
        default_type image/svg+xml;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /favicon.ico {
        types { }
        alias /opt/2nas/web/public/favicons/snegurochki.svg;
        default_type image/svg+xml;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }
    include snippets/vp-hub.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location ~ ^/yandex_[0-9a-f]+\.html$ {
        root /var/www/verify/snegurochkimoscow.com;
    }
    location / {
        include snippets/ga4-nonsalons/snegurochkimoscow.com.conf;
        include snippets/vp-beacon.conf;
        proxy_pass http://127.0.0.1:5134;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    ssl_certificate /etc/letsencrypt/live/snegurochkimoscow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snegurochkimoscow.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
